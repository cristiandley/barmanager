name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build (debug)
        run: swift build
      - name: Build app bundle (release)
        run: ./Scripts/build-app.sh
      - name: Smoke test CLI mode
        run: |
          ./build/BarManager.app/Contents/MacOS/BarManager toggle
          ./build/BarManager.app/Contents/MacOS/BarManager reveal
